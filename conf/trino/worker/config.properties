# ========================= Trino worker ==========================
# Workers are started as scalable replicas (`make scale N=3`), so this file
# intentionally carries no node identity - node.id is generated per container.
coordinator=false

http-server.http.port=8080
discovery.uri=http://trino-coordinator:8080

query.max-memory=4GB
query.max-memory-per-node=512MB

# Must match the coordinator, otherwise the cluster refuses the worker.
#retry-policy=QUERY
#retry-policy=TASK
