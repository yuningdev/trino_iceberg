# Spooling exchange used only when retry-policy is enabled in
# config.properties. Points at the same MinIO instance as the lakehouse.
exchange-manager.name=filesystem
exchange.base-directories=s3://${ENV:LAKEHOUSE_BUCKET}/exchange-spooling
exchange.s3.region=${ENV:AWS_REGION}
exchange.s3.aws-access-key=${ENV:MINIO_ROOT_USER}
exchange.s3.aws-secret-key=${ENV:MINIO_ROOT_PASSWORD}
exchange.s3.endpoint=http://minio:9000
exchange.s3.path-style-access=true
