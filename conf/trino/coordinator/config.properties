# ======================= Trino coordinator =======================
coordinator=true
# Keep the coordinator out of the scheduling pool so that "distributed"
# actually means distributed - every split lands on a worker.
node-scheduler.include-coordinator=false

http-server.http.port=8080
discovery.uri=http://trino-coordinator:8080

# Cluster-wide / per-node query memory. Deliberately conservative so the
# defaults fit inside the image's default JVM heap. See README if you raise
# the heap via conf/trino/jvm.config.
query.max-memory=4GB
query.max-memory-per-node=512MB

# Fault-tolerant execution. Uncomment one of these to exercise Trino's
# retryable queries/tasks; conf/trino/exchange-manager.properties already
# points the spooling exchange at MinIO.
#retry-policy=QUERY
#retry-policy=TASK
