# Federation demo: query the Hive Metastore's own Postgres schema from Trino.
#   SELECT "NAME", "DB_LOCATION_URI" FROM metastore_db.public."DBS";
connector.name=postgresql
connection-url=jdbc:postgresql://postgres:5432/${ENV:HMS_DB_NAME}
connection-user=${ENV:HMS_DB_USER}
connection-password=${ENV:HMS_DB_PASSWORD}

# The Hive schema uses quoted upper-case identifiers ("TBLS", "DBS", ...).
# Without this, Trino lists them lower-cased but cannot resolve them back,
# so even `DESCRIBE metastore_db.public.tbls` fails with "does not exist".
case-insensitive-name-matching=true
