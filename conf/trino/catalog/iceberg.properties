# ============================================================================
# Primary lakehouse catalog: Iceberg tables, Hive Metastore for the catalog,
# MinIO for the data. ${ENV:...} is resolved by Trino from the container env,
# which is populated from .env - no secrets live in this file.
# ============================================================================
connector.name=iceberg

# --- catalog (metadata pointer store) ---------------------------------------
iceberg.catalog.type=hive_metastore
hive.metastore.uri=thrift://hive-metastore:9083
# Short cache TTL: metadata changes made outside Trino show up quickly.
hive.metastore-cache-ttl=0s

# --- object storage ---------------------------------------------------------
fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=${ENV:AWS_REGION}
s3.path-style-access=true
s3.aws-access-key=${ENV:MINIO_ROOT_USER}
s3.aws-secret-key=${ENV:MINIO_ROOT_PASSWORD}

# --- table defaults / features ----------------------------------------------
iceberg.file-format=PARQUET
iceberg.compression-codec=ZSTD
# Enables CALL iceberg.system.register_table(...) for adopting existing
# metadata.json files written by Spark/Flink/etc.
iceberg.register-table-procedure.enabled=true
# ANALYZE / NDV sketches, so EXPLAIN shows real cost estimates.
# iceberg.extended-statistics.enabled is defunct in Trino >=484 (extended
# stats are always on); collect-on-write is the remaining knob.
iceberg.extended-statistics.collect-on-write=true
iceberg.table-statistics-enabled=true

# Transparently forward reads of plain Hive tables to the `hive` catalog.
iceberg.hive-catalog-name=hive
