# ============================================================================
# Same metastore, same bucket, but classic Hive tables. Useful for comparing
# Hive vs Iceberg behaviour and for testing catalog redirection in both
# directions.
# ============================================================================
connector.name=hive
hive.metastore.uri=thrift://hive-metastore:9083
hive.metastore-cache-ttl=0s

fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=${ENV:AWS_REGION}
s3.path-style-access=true
s3.aws-access-key=${ENV:MINIO_ROOT_USER}
s3.aws-secret-key=${ENV:MINIO_ROOT_PASSWORD}

hive.non-managed-table-writes-enabled=true
hive.recursive-directories=true
# Playground convenience: DROP TABLE actually removes the files.
hive.metastore.thrift.delete-files-on-drop=true

# Transparently forward reads of Iceberg tables to the `iceberg` catalog.
hive.iceberg-catalog-name=iceberg
