# ============================================================================
# Alternative catalog: Apache Polaris via the Iceberg REST protocol.
# Mounted into Trino's catalog dir only by docker-compose.polaris.yml, so the
# base stack stays Hive-only.
#
# Same MinIO bucket, different catalog implementation - which is exactly the
# comparison this playground exists for.
# ============================================================================
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://polaris:8181/api/catalog
iceberg.rest-catalog.warehouse=${ENV:POLARIS_CATALOG}

iceberg.rest-catalog.security=OAUTH2
iceberg.rest-catalog.oauth2.credential=${ENV:POLARIS_CLIENT_ID}:${ENV:POLARIS_CLIENT_SECRET}
iceberg.rest-catalog.oauth2.scope=PRINCIPAL_ROLE:ALL

# Polaris can hand Trino scoped, short-lived storage credentials instead of
# Trino holding long-lived keys. Turn this off (and rely on the fs.native-s3
# settings below) if the Polaris storage config is not issuing credentials.
iceberg.rest-catalog.vended-credentials-enabled=true

fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=${ENV:AWS_REGION}
s3.path-style-access=true
s3.aws-access-key=${ENV:MINIO_ROOT_USER}
s3.aws-secret-key=${ENV:MINIO_ROOT_PASSWORD}

iceberg.file-format=PARQUET
iceberg.compression-codec=ZSTD
